services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selfad
      POSTGRES_USER: selfad
      POSTGRES_PASSWORD: ${SELFAD_POSTGRES_PASSWORD:?Set SELFAD_POSTGRES_PASSWORD in .env}
    volumes:
      - selfad-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      database:

  selfad:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: selfad:luna
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8929:8929"
      - "${SELFAD_GITEA_SSH_PORT:-2224}:22"
    environment:
      SELFAD_ENABLE_INTERNAL_RUNNER: "false"
      SELFAD_DATABASE_URL: postgresql+psycopg://selfad:${SELFAD_POSTGRES_PASSWORD}@postgres:5432/selfad
      # The control plane stays available until a dedicated TLS runner is connected.
      SELFAD_RUNNER_DOCKER_HOST: ${SELFAD_RUNNER_DOCKER_HOST:-tcp://127.0.0.1:2376}
      SELFAD_RUNNER_TLS_VERIFY: ${SELFAD_RUNNER_TLS_VERIFY:-false}
      SELFAD_SECURE_COOKIES: "true"
      SELFAD_GITEA_PUBLIC_URL: https://luna.maxcyou.ru/git
      SELFAD_GITEA_WEBHOOK_URL: http://127.0.0.1:8000/hooks/gitea
      GITEA__server__ROOT_URL: https://luna.maxcyou.ru/git/
      GITEA__server__DOMAIN: luna.maxcyou.ru
      GITEA__server__SSH_DOMAIN: luna.maxcyou.ru
      GITEA__server__SSH_PORT: ${SELFAD_GITEA_SSH_PORT:-2224}
      SELFAD_METRICS_TOKEN: ${SELFAD_METRICS_TOKEN:?Set SELFAD_METRICS_TOKEN in .env}
      SELFAD_SECRET_KEY: ${SELFAD_SECRET_KEY:?Set SELFAD_SECRET_KEY in .env}
      SELFAD_WORKER_CONCURRENCY: "1"
      SELFAD_TRUST_PROXY_HEADERS: "true"
      SELFAD_TRUSTED_PROXY_HOSTS: 172.31.0.1
    volumes:
      - selfad-data:/data
    mem_limit: 1g
    shm_size: 64m
    networks:
      proxy:
        ipv4_address: 172.31.0.3
      database:

volumes:
  selfad-data:
  selfad-postgres:

networks:
  proxy:
    ipam:
      config:
        - subnet: 172.31.0.0/24
  database:
    internal: true
