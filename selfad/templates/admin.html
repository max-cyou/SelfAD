<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SelfAD administration.">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version('app.css') }}">
  </head>
  <body style="{{ palette_style }}" data-admin-section="{{ active_section }}">
    <div class="page page--admin">
      {% include "_header.html" %}

      <main class="admin-main">
        <section class="admin-heading" aria-labelledby="admin-title">
          <h1 id="admin-title">Admin panel</h1>
          <p>Settings for the {{ site_name }} contest.</p>
        </section>

        <div class="admin-workspace">
          {% include "admin/sidebar.html" %}

          <div class="admin-content">

            {% include "admin/general.html" %}

            {% include "admin/services.html" %}

            {% include "admin/users.html" %}

            {% include "admin/appearance.html" %}

          </div>
        </div>
      </main>
      {% include "_footer.html" %}
    </div>
    <script src="{{ url_for('static', path='/admin.js') }}?v={{ static_version('admin.js') }}" defer></script>
  </body>
</html>
