<!doctype html>
<html lang="en" style="{{ palette_style }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SelfAD instance status.">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version('app.css') }}">
  </head>
  <body>
    <div class="page">
      {% include "_header.html" %}

      <main class="home-main">
        {% if contest_state == 'started' %}
          {{ started_homepage_html | safe }}
        {% elif contest_state == 'ended' %}
          {{ ended_homepage_html | safe }}
        {% else %}
          {{ not_started_homepage_html | safe }}
        {% endif %}
      </main>
      {% include "_footer.html" %}
    </div>
  </body>
</html>
