<section class="gitea-credentials" aria-labelledby="gitea-credentials-title">
    <div class="gitea-credentials-heading">
      <div>
        <h3 id="gitea-credentials-title">Gitea administrator</h3>
        <p>Credentials for the local Git server.</p>
      </div>
      {% if gitea_public_enabled %}<a href="{{ gitea_public_url }}" target="_blank" rel="noopener noreferrer">Open Gitea <span aria-hidden="true">↗</span></a>{% endif %}
    </div>

    <dl class="credential-list">
      <div>
        <dt>Username</dt>
        <dd><code>root</code></dd>
      </div>
      <div>
        <dt>Password</dt>
        <dd class="credential-password">
          <code data-gitea-password>••••••••••••••••</code>
          <button
            type="button"
            data-gitea-password-reveal
            data-credentials-url="{{ url_for('gitea_credentials') }}"
          >Show</button>
          <button type="button" data-gitea-password-copy hidden>Copy</button>
        </dd>
      </div>
    </dl>
    <p class="credential-status" data-gitea-credential-status aria-live="polite"></p>
  </section>
