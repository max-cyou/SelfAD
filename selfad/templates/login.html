<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Sign in to SelfAD.">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ static_version('app.css') }}">
  </head>
  <body style="{{ palette_style }}">
    <div class="page">
      {% include "_header.html" %}

      <main class="auth-main">
        <section class="auth-card" aria-labelledby="login-title">
          <div class="auth-heading">
            <h1 id="login-title">Sign in</h1>
            <p>Use your SelfAD username and Gitea password.</p>
          </div>

          {% if error %}
            <div class="auth-error" role="alert">{{ error }}</div>
          {% endif %}

          <form class="auth-form" method="post" action="{{ url_for('submit_login') }}">
            <div class="field">
              <label for="username">Username</label>
              <input
                id="username"
                name="username"
                type="text"
                value="{{ username }}"
                autocomplete="username"
                autocapitalize="none"
                spellcheck="false"
                autofocus
                required
              >
            </div>

            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                maxlength="128"
                autocomplete="current-password"
                required
              >
            </div>

            <button type="submit">Sign in</button>
            {% if registration_enabled %}<a class="auth-switch-link" href="/register">Create account →</a>{% endif %}
          </form>
        </section>
      </main>
      {% include "_footer.html" %}
    </div>
  </body>
</html>
