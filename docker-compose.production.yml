services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: selfad
      POSTGRES_USER: ${SELFAD_POSTGRES_USER:-selfad}
      POSTGRES_PASSWORD: ${SELFAD_POSTGRES_PASSWORD:?Set SELFAD_POSTGRES_PASSWORD in .env}
    volumes:
      - selfad-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks:
      database:

  selfad:
    build: .
    image: selfad:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SELFAD_GITEA_SSH_PORT:-2224}:22"
    environment:
      SELFAD_ENABLE_INTERNAL_RUNNER: "false"
      SELFAD_PUBLIC_EVENT_MODE: "true"
      SELFAD_DATABASE_URL: postgresql+psycopg://${SELFAD_POSTGRES_USER:-selfad}:${SELFAD_POSTGRES_PASSWORD}@postgres:5432/selfad
      SELFAD_RUNNER_DOCKER_HOST: ${SELFAD_RUNNER_DOCKER_HOST:?Set the remote TLS Docker endpoint}
      SELFAD_RUNNER_ISOLATION: ${SELFAD_RUNNER_ISOLATION:?Set dedicated-host after verifying runner separation}
      SELFAD_RUNNER_TLS_VERIFY: "true"
      SELFAD_RUNNER_CERT_PATH: /run/selfad-runner-tls
      SELFAD_SECURE_COOKIES: "true"
      SELFAD_GITEA_PUBLIC_URL: ${SELFAD_GITEA_PUBLIC_URL:?Set the public Gitea URL}
      SELFAD_GITEA_WEBHOOK_URL: http://127.0.0.1:8000/hooks/gitea
      GITEA__server__ROOT_URL: ${SELFAD_GITEA_PUBLIC_URL:?Set the public Gitea URL}/
      GITEA__server__DOMAIN: ${SELFAD_GITEA_DOMAIN:?Set the public Gitea hostname}
      GITEA__server__SSH_DOMAIN: ${SELFAD_GITEA_SSH_DOMAIN:?Set the public Gitea SSH hostname}
      GITEA__server__SSH_PORT: ${SELFAD_GITEA_SSH_PUBLIC_PORT:-2224}
      SELFAD_METRICS_TOKEN: ${SELFAD_METRICS_TOKEN:?Set a long random token}
      SELFAD_SECRET_KEY: ${SELFAD_SECRET_KEY:?Set a 32+ character random value}
      SELFAD_SETUP_TOKEN: ${SELFAD_SETUP_TOKEN:?Set a 32+ character random setup token}
      SELFAD_WORKER_CONCURRENCY: ${SELFAD_WORKER_CONCURRENCY:-1}
      SELFAD_TRUST_PROXY_HEADERS: "true"
      SELFAD_TRUSTED_PROXY_HOSTS: 172.30.0.2
    volumes:
      - selfad-data:/data
      - ${SELFAD_RUNNER_TLS_DIR:?Set the directory with ca.pem, cert.pem and key.pem}:/run/selfad-runner-tls:ro
    mem_limit: 1g
    shm_size: 64m
    networks:
      edge:
        ipv4_address: 172.30.0.3
      database:

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      selfad:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SELFAD_PUBLIC_DOMAIN: ${SELFAD_PUBLIC_DOMAIN:?Set the public SelfAD hostname}
      SELFAD_GITEA_DOMAIN: ${SELFAD_GITEA_DOMAIN:?Set the public Gitea hostname}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - selfad-caddy-data:/data
      - selfad-caddy-config:/config
    mem_limit: 128m
    networks:
      edge:
        ipv4_address: 172.30.0.2

volumes:
  selfad-data:
  selfad-postgres:
  selfad-caddy-data:
  selfad-caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24
  database:
    internal: true
