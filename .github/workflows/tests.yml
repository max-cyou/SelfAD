name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches the Python inside the published image; 3.14 is the
        # current stable line the project is developed against.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check selfad tests migrations main.py
      - run: mypy
      - run: pip-audit -r requirements.txt
      - run: docker compose -f compose.yaml config --quiet
      - run: docker compose -f docker-compose.production.yml config --quiet
        env:
          SELFAD_POSTGRES_PASSWORD: ci-postgres-password
          SELFAD_RUNNER_DOCKER_HOST: tcp://runner.internal:2376
          SELFAD_RUNNER_ISOLATION: dedicated-host
          SELFAD_RUNNER_TLS_DIR: /tmp/selfad-runner-tls
          SELFAD_GITEA_PUBLIC_URL: https://git.example.test
          SELFAD_GITEA_DOMAIN: git.example.test
          SELFAD_GITEA_SSH_DOMAIN: git.example.test
          SELFAD_METRICS_TOKEN: mmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmmm
          SELFAD_SECRET_KEY: ssssssssssssssssssssssssssssssssssssssssssssssss
          SELFAD_SETUP_TOKEN: uuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuuu
          SELFAD_PUBLIC_DOMAIN: ctf.example.test

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: selfad_test
          POSTGRES_USER: selfad
          POSTGRES_PASSWORD: selfad-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selfad -d selfad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SELFAD_DATABASE_URL: postgresql+psycopg://selfad:selfad-test-password@127.0.0.1:5432/selfad_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_postgresql_migrations -v
      # The migration tests clean up their schema in tearDown. Recreate the
      # versioned schema before asking Alembic to compare it with the models.
      - run: alembic upgrade head
      - run: alembic check

  stack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: ./scripts/ops/doctor.sh
      - if: always()
        run: docker compose down --volumes
